# Manifest del backend NewRay (incremento A-01).
# La specifica (NewRay.md §4.2) definisce le responsabilità; qui le versioni
# sono stabilite con lower bound stabili e bloccate in uv.lock. Niente
# prerelease: le release devono essere stabili e qualificate in CI.

[project]
name = "newray"
version = "0.1.0"
description = "NewRay — assistente di lavoro locale: backend Python 3.12, FastAPI, monolite modulare"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API e trasporto (NewRay.md §4.2)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Contratti e configurazione: validazione ai confini
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Persistenza: repository, transazioni, migrazioni versionate
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    # HTTP in uscita: client con timeout e policy di rete
    "httpx>=0.27",
    # Credenziali locali: Argon2id (NewRay.md §§4.2/20.3)
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newray"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Regole di base; i controlli architetturali degli import nascono con A-06.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Pattern canonico delle dipendenze FastAPI (chiamata in default di parametro).
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["newray", "fakes"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["newray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
